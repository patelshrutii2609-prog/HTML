<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in HTML</title>
</head>
<body>
    <h2>Forms in HTML:</h2>
    <form action="">
    <label for="firstName"> First Name:</label>
      <input id="firstName" type="text" minlength="5" maxlength="12" required/>

      <label for="middleName"> Middle Name:</label>
        <input id="middleName" type="text" />

      <label for="lastName"> Last Name:</label>
        <input id="lastName" type="text" />

        <br><br>

        <label for="age">Age:</label>
        <input id="age" type="number" />

        <br><br>

        <label for="email">Email:</label>
        <input id="email" type="email" />

        <br><br>

        <label for="doj">Date of Joining:</label>
        <input id="doj" type="date"/>

        <br><br>

        <label for="password">Password:</label>
        <input id="password" type="password" /> 

<p>Enter your Shirt Size:</p>
<input type="radio" name="shirtsize" id="small"/>
<label for="small">Small Size</label>
<input type="radio" name="shirtsize" id="medium"/>
<label for="medium">Medium Size</label>
<input type="radio" name="shirtsize" id="large"/> 
<label for="large">Large Size</label>

<br><br>

<p>select the known languages:</p>
<input type="checkbox" name="languages" id="English"/>
<label for="English">English</label>
<input type="checkbox" name="languages" id="Hindi"/>
<label for="Hindi">Hindi</label>
<input type="checkbox" name="languages" id="Gujarati"/>
<label for="Gujarati">Gujarati</label>
<input type="checkbox" name="languages" id="Telugu"/>
<label for="Telugu">Telugu</label>

<br><br>

<label for="color">please select the color for your shirt:</label>
<input id="color" type="color" />

<br><br>

<label for="paymentOption">please select a payment method:</label>
<select name="payment" id="paymentOption">
  <option value=""></option>
    <option value="gpay">gpay</option>
    <option value="phonepe">phonepe</option>
    <option value="UPI">UPI</option>
    <option value="">creditcard</option>
    <option value="">cod</option>
</select>

<br><br>

<label for="cmts">please provide your valuable feedback:</label>
<!--<input type="text" />-->
<textarea name="cmt" id="cmts" rows="18" cols="100" placeholder="pls enter your comments here..."></textarea>

<br><br>

<input type="reset" />
<input type="submit" />

    </form>
</body>
</html>
